name: Bright
on:
  pull_request:
    branches:
      - '**'
permissions:
  checks: write
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
      - name: Install dependencies
        run: |
          bundle install
        env:
          CI_AGENT_STEP_NAME: Install dependencies
          CI_AGENT_STEP_INDEX: "3"
      - name: Set up database
        run: |
          rake db:create
        env:
          CI_AGENT_STEP_NAME: Set up database
          CI_AGENT_STEP_INDEX: "4"
      - name: Migrate database
        run: |
          rake db:migrate
        env:
          CI_AGENT_STEP_NAME: Migrate database
          CI_AGENT_STEP_INDEX: "5"
      - name: Seed database
        run: |
          rake db:seed
        env:
          CI_AGENT_STEP_NAME: Seed database
          CI_AGENT_STEP_INDEX: "6"
      - name: Start application
        env:
          CI_AGENT_STEP_NAME: Start application
          CI_AGENT_STEP_INDEX: "7"
          secret_key_base: secret
        run: |
          rails server &
      - name: Probe application readiness
        run: |
          i=1; while [ "$i" -le 30 ]; do curl -sS -o /dev/null http://127.0.0.1:3000 && exit 0; sleep 5; i=$((i + 1)); done; exit 1
        env:
          CI_AGENT_STEP_NAME: Probe application readiness
          CI_AGENT_STEP_INDEX: "8"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install SecTesterJS dependencies
        run: |
          npm i --save=false --prefix .brightsec @sectester/core@0.50.0 @sectester/repeater@0.50.0 @sectester/scan@0.50.0 @sectester/runner@0.50.0 @sectester/reporter@0.50.0
        env:
          CI_AGENT_STEP_NAME: Install SecTesterJS dependencies
          CI_AGENT_STEP_INDEX: "10"
      - name: Authenticate with Bright
        uses: ./.github/workflows/composite/configure-bright-credentials
        with:
          BRIGHT_HOSTNAME: development.playground.brightsec.com
          BRIGHT_PROJECT_ID: 5naKKxNc3e4Akp1GuEdmiK
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          CUSTOM_BRIGHT_TOKEN: ${{ secrets.CUSTOM_BRIGHT_TOKEN }}
        env:
          OIDC_AUDIENCE: https://development.playground.brightsec.com
      - name: Run security tests
        env:
          CI_AGENT_STEP_NAME: Run security tests
          CI_AGENT_STEP_INDEX: "12"
          BRIGHT_HOSTNAME: development.playground.brightsec.com
          BRIGHT_PROJECT_ID: 5naKKxNc3e4Akp1GuEdmiK
          BRIGHT_AUTH_ID: m8XBzLrw8pWSjHQDhKQgCr
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ env.BRIGHT_TOKEN }}
          BRIGHT_TARGET_URL: http://127.0.0.1:3000
          SECTESTER_SCAN_POOL_SIZE: ${{ vars.SECTESTER_SCAN_POOL_SIZE }}
        run: |-
          node --experimental-transform-types --experimental-strip-types --experimental-detect-module --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning --test-force-exit --test-concurrency=4 --test .brightsec/tests/*.test.ts
    env:
      CI_AGENT_BASE_URL: https://hk4kznt3-8081.euw.devtunnels.ms/
      CI_AGENT_RUN_ID: ${{ github.run_id }}
      CI_AGENT_REPOSITORY: ${{ github.repository }}
      CI_AGENT_WORKFLOW_BRANCH: ${{ github.head_ref }}
      CI_AGENT_JOB_NAME: test
      CI_AGENT_WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
      CI_AGENT_DEBUG: ${{ vars.CI_AGENT_DEBUG }}
      CI_AGENT_READINESS_STEP_NAME: Probe application readiness
    defaults:
      run:
        shell: bash .github/scripts/bright-step-repair-shell.sh {0}
